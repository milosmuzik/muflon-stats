<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muflon Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-title">Muflon<span>Stats</span></div>
    <div class="tab-label brand-sub">Rock &amp; Metal 24/7 · živé sledování streamu</div>
  </div>
  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span class="tab-label" id="statusText">načítám…</span>
  </div>
</header>

<main class="wrap">

  <section class="hero index-card">
    <div class="hero-card">
      <div class="hero-num" id="numPlays">–</div>
      <div class="tab-label">skladeb</div>
    </div>
    <div class="hero-card">
      <div class="hero-num" id="numUnique">–</div>
      <div class="tab-label">unikátních</div>
    </div>
    <div class="hero-card">
      <div class="hero-num" id="numHours">–</div>
      <div class="tab-label">hodin hudby</div>
    </div>
  </section>

  <section class="panel index-card">
    <h2 class="panel-title">Nejhranější skladby<span class="tab-label" id="rangeLabel">posledních 7 dní</span></h2>
    <ol class="leaderboard" id="leaderboard">
      <li class="empty">Zatím žádná data.</li>
    </ol>
  </section>

  <section class="panel index-card">
    <h2 class="panel-title">Kdy se hraje nejvíc<span class="tab-label">podle hodiny dne</span></h2>
    <div class="chart" id="chart" role="img" aria-label="Graf počtu přehrání podle hodiny dne"></div>
  </section>

  <section class="panel index-card">
    <h2 class="panel-title">Živý log<span class="tab-label">posledních 50</span></h2>
    <ul class="live-log" id="liveLog">
      <li class="empty">Zatím žádná data.</li>
    </ul>
  </section>

  <section class="panel index-card social">
    <h2 class="panel-title">Shrnutí pro sociální sítě</h2>
    <textarea id="socialText" rows="4" readonly></textarea>
    <button class="btn" id="copyBtn">Kopírovat text</button>
  </section>

  <footer class="foot">
    <span class="tab-label" id="updatedAt">–</span>
    <button class="btn btn-outline" id="refreshBtn">Obnovit</button>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
