<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muflon Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 10c-3 0-5 2-5 5 0 2 1 3 1 5-4 1-7 4-8 8-3-1-6 1-6 4 0 2 2 4 4 4 1 4 4 7 8 8-1 2-2 4-2 6 0 3 2 5 5 5s5-2 5-5c0-2-1-4-2-6 4-1 7-4 8-8 2 0 4-2 4-4 0-3-3-5-6-4-1-4-4-7-8-8 0-2 1-3 1-5 0-3-2-5-5-5z" fill="currentColor"/>
    </svg>
    <div class="brand-text">
      <div class="brand-title">MUFLON<span>STATS</span></div>
      <div class="brand-sub">Rock &amp; Metal 24/7 · živé sledování streamu</div>
    </div>
  </div>
  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">načítám…</span>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-card">
      <div class="hero-num" id="numPlays">–</div>
      <div class="hero-label"><span>skladeb</span></div>
    </div>
    <div class="hero-card">
      <div class="hero-num" id="numUnique">–</div>
      <div class="hero-label"><span>unikátních</span></div>
    </div>
    <div class="hero-card">
      <div class="hero-num" id="numHours">–</div>
      <div class="hero-label"><span>hodin hudby</span></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Nejhranější skladby <em>posledních 7 dní</em></h2>
    <ol class="leaderboard" id="leaderboard">
      <li class="empty">Zatím žádná data.</li>
    </ol>
  </section>

  <section class="panel">
    <h2 class="panel-title">Kdy se hraje nejvíc <em>podle hodiny dne</em></h2>
    <div class="chart" id="chart" role="img" aria-label="Graf počtu přehrání podle hodiny dne"></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Živý log <em>posledních 50</em></h2>
    <ul class="live-log" id="liveLog">
      <li class="empty">Zatím žádná data.</li>
    </ul>
  </section>

  <section class="panel social">
    <h2 class="panel-title">Shrnutí pro sociální sítě</h2>
    <div class="sticker">
      <textarea id="socialText" rows="4" readonly></textarea>
    </div>
    <button class="btn" id="copyBtn">Kopírovat text</button>
  </section>

  <footer class="foot">
    <span id="updatedAt">–</span>
    <button class="btn btn-outline" id="refreshBtn">Obnovit</button>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
